[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-detector"
version = "0.1.0"
description = "Forte: Finding Outliers with Representation Typicality Estimation - A PyTorch library for OOD detection using topology-aware representation learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Debargha Ganguly", email = "debargha.ganguly@gmail.com"},
    {name = "Warren Richard Morningstar"},
    {name = "Andrew Seohwan Yu"},
    {name = "Vipin Chaudhary"}
]
maintainers = [
    {name = "Debargha Ganguly", email = "debargha.ganguly@gmail.com"}
]
keywords = [
    "outlier-detection",
    "out-of-distribution",
    "ood-detection",
    "computer-vision",
    "deep-learning",
    "pytorch",
    "representation-learning",
    "anomaly-detection",
    "prdc",
    "clip",
    "vision-transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
viz = [
    "matplotlib>=3.7.0",
]
all = [
    "forte-detector[dev,docs,viz]",
]

[project.urls]
Homepage = "https://github.com/debarghag/forte-detector"
Documentation = "https://debarghag.github.io/forte-detector"
"Source Code" = "https://github.com/debarghag/forte-detector"
"Bug Tracker" = "https://github.com/debarghag/forte-detector/issues"
"Paper" = "https://openreview.net/pdf?id=7XNgVPxCiA"
"ICLR 2025" = "https://openreview.net/pdf?id=7XNgVPxCiA"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["forte*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | env
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=forte",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.coverage.run]
source = ["src/forte"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "env", ".venv", "venv"]
skips = ["B101"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "D100", "D104"]
per-file-ignores = [
    "forte_api.py:D,F401,F841",
    "forte_demo.py:D,F401",
    "examples/*.py:D",
    "tests/*.py:D",
    "__init__.py:F401",
]
docstring-convention = "google"
